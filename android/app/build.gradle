plugins { id 'com.android.application' }
android {
    namespace 'org.daytona.local'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.daytona.local'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-local'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DDAYTONA_PREBUILT_GAME_CODE=',
                    "-DDAYTONA_GENERATED_ROOT=${rootProject.file('../build/gen').absolutePath}",
                    '-DSDL_TESTS=OFF', '-DSDL_EXAMPLES=OFF', '-DCMAKE_BUILD_TYPE=Release'
                targets 'main'
            }
        }
    }
    signingConfigs {
        local {
            storeFile file(System.getenv('DAYTONA_KEYSTORE'))
            storePassword System.getenv('DAYTONA_KEY_PASSWORD')
            keyAlias 'daytona-local'
            keyPassword System.getenv('DAYTONA_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.local
        }
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '3.22.1' } }
    sourceSets.main {
        java.srcDirs += '../../extern/sdl3/android-project/app/src/main/java'
        assets.srcDirs += '../../build/android-assets'
    }
    androidResources { noCompress += 'zip' }
    packaging { jniLibs { useLegacyPackaging = false } }
}
